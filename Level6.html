<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 6 - Form Validation</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: linear-gradient(90deg, #34900c, #8fc700, #f9de10);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .btn:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
      }

      .card {
        border-radius: 20px;
        border: none;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .card:hover {
        transform: scale(1.03);
        transition: transform 0.3s ease;
      }

      .error-message {
        color: #dc3545;
        font-weight: bold;
        margin-top: 10px;
      }

      .success-message {
        color: #28a745;
        font-weight: bold;
        margin-top: 10px;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center shadow-lg">
              <h1 class="card-title mb-3">🎯 Final Challenge</h1>
              <p class="card-text text-muted mb-4">
                Congratulations on reaching the final level! You'll now use
                conditional statements (if/else). Choose the correct door to
                complete your quest. Only one door leads to victory!
              </p>
              <span class="badge level-badge fs-5 mb-4">Level 6</span>

              <!-- Choice Buttons -->
              <div class="my-4">
                <h4>Choose Your Door:</h4>
                <button class="btn btn-info choice-btn" onclick="makeChoice(1)">
                  🌸 Flower 1
                </button>
                <button
                  class="btn btn-warning choice-btn"
                  onclick="makeChoice(2)"
                >
                  🌺 Flower 2
                </button>
                <button
                  class="btn btn-success choice-btn"
                  onclick="makeChoice(3)"
                >
                  🌹 Flower 3
                </button>
              </div>

              <!-- Result Message Area -->
              <div id="resultArea"></div>

              <div class="d-flex justify-content-between mt-4">
                <a href="level5.html" class="btn btn-secondary">← Back</a>
                <a href="level1.html" class="btn btn-primary"
                  >Restart Quest →</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
      function makeChoice(doorNumber) {
        // Get the result area element
        const resultArea = document.getElementById("resultArea");

        // Use if/else statements to check which door was chosen
        if (doorNumber === 3) {
          // Door 2 is the correct choice - display success message
          resultArea.innerHTML =
            '<div class="result-message success-result">Success! You chose the correct Flower! Quest completed!</div>';
        } else {
          // Any other door - display try again message
          resultArea.innerHTML =
            '<div class="result-message fail-result">Wrong door! Try again!</div>';
        }
      }
    </script>
  </body>
</html>
