<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 5 - Form Validation</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: linear-gradient(90deg, #526b9d, #8e51ac, #000000);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .btn:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
      }

      .card {
        border-radius: 20px;
        border: none;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .card:hover {
        transform: scale(1.03);
        transition: transform 0.3s ease;
      }

      .error-message {
        color: #dc3545;
        font-weight: bold;
        margin-top: 10px;
      }

      .success-message {
        color: #28a745;
        font-weight: bold;
        margin-top: 10px;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="container mt-6  ">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center shadow-lg">
              <h1 class="card-title mb-3">Counter Challenge</h1>
              <p class="card-text text-muted mb-4">
                Fantastic! You've reached Level 5. Now you'll work with
                variables and counters. Use the buttons to increase or decrease
                your coin count!
              </p>
              <span class="badge level-badge fs-5 mb-4">Level 5</span>

              <!-- Coin Counter Display -->
              <div class="coin-display" id="coinDisplay">Coins: 0</div>

              <!-- Counter Buttons -->
              <div class="mb-4">
                <button
                  class="btn btn-danger counter-btn"
                  onclick="decreaseCoins()"
                >
                  −1
                </button>
                <button
                  class="btn btn-success counter-btn"
                  onclick="increaseCoins()"
                >
                  +1
                </button>
              </div>

              <div class="d-flex justify-content-between mt-4">
                <a href="Level4.html" class="btn btn-secondary">← Back</a>
                <a href="Level6.html" class="btn btn-primary">Next Level →</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
      // Initialize coin counter variable
      let coins = 0;

      // Function to increase coins
      function increaseCoins() {
        coins = coins + 1;
        updateDisplay();
      }

      // Function to decrease coins
      function decreaseCoins() {
        // Check if coins is greater than 0 before decreasing
        if (coins > 0) {
          coins = coins - 1;
          updateDisplay();
        }
      }

      // Function to update the display
      function updateDisplay() {
        document.getElementById("coinDisplay").textContent = "Coins: " + coins;
      }
    </script>
  </body>
</html>
