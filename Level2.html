<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      body {
        background-image: linear-gradient(90deg, #900c3f, #c70039, #f94c10);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .btn:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
      }
      .card {
        border-radius: 20px;
        border: none;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .card:hover {
        transform: scale(1.03);
        transition: transform 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center shadow-lg">
              <h1 class="card-title mb-3">CSS Styling</h1>
              <p class="card-text my-3">
                Excellent work! You've now learned how to apply custom CSS
                styling to enhance your web pages. Notice the new background
                color, rounded corners, shadows, and button hover effects!
              </p>
              <span class="badge bg-danger">Level 2</span>

              <div class="d-flex justify-content-between mt-4">
                <a href="level1.html" class="btn btn-secondary"> Back </a>
                <a href="level3.html" class="btn btn-primary">Next Level</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
