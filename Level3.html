<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-image: linear-gradient(90deg, #0c7390, #00a2c7, #10def9);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .btn:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
      }
      .card {
        border-radius: 20px;
        border: none;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .card:hover {
        transform: scale(1.03);
        transition: transform 0.3s ease;
      }
      
    </style>
  </head>
  <body>
    <div class="container mt-1">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body text-center shadow-lg">
              <h2 class="card-title mb-3">
                JavaScript DOM Manipulation and Events
              </h2>
              <p class="card-text my-3">
                Amazing progress! Now you'll learn JavaScript DOM manipulation.
                Click the "Level Up" button to increase your level dynamically!
              </p>
              <span class="badge mb-3 bg-info" id="lvlBadge">Level 1</span>
              <div class="level-message mb-4" id="statusMsg">
                Current Level: 1
              </div>

              <button
                class="btn btn-warning btn-lg mb-4"
                id="levelUpBtn"
                onclick="levelUp()"
              >
                Level Up!
              </button>

              <div class="d-flex justify-content-between mt-4">
                <a href="level2.html" class="btn btn-secondary"> Back </a>
                <a href="level4.html" class="btn btn-primary">Next Level</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      let count = 1;
      function levelUp() {
        if (count < 6) {
          count++;
          document.getElementById("lvlBadge").innerText = "Level " + count;
          document.getElementById("statusMsg").innerText =
            "Current Level: " + count;
        } else {
          console.log("Max level reached");
        }
      }
    </script>
  </body>
</html>
