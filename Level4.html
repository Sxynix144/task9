<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 4 - Form Validation</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: linear-gradient(90deg, #34900c, #8fc700, #f9de10);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .btn:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
      }

      .card {
        border-radius: 20px;
        border: none;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .card:hover {
        transform: scale(1.03);
        transition: transform 0.3s ease;
      }

      .error-message {
        color: #dc3545;
        font-weight: bold;
        margin-top: 10px;
      }

      .success-message {
        color: #28a745;
        font-weight: bold;
        margin-top: 10px;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center shadow-lg">
              <h1 class="card-title mb-3">📝 Form Validation</h1>
              <p class="card-text text-muted mb-4">
                Great job reaching Level 4! Now you'll learn form validation.
                Enter your hero name below and submit the form.
              </p>
              <span class="badge level-badge fs-5 mb-4">Level 4</span>

              <!-- Form Section -->
              <div class="mt-2 mb-4">
                <label for="heroName" class="form-label fw-bold"
                  >Hero Name:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="heroName"
                  placeholder="Enter your hero name"
                />
                <button class="btn btn-danger mt-3" onclick="validateForm()">
                  Submit
                </button>
              </div>

              <!-- Message Display Area -->
              <div id="messageArea"></div>

              <div class="d-flex justify-content-between mt-4">
                <a href="level3.html" class="btn btn-secondary">← Back</a>
                <a href="level5.html" class="btn btn-success">Next Level →</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
      function validateForm() {
        // Get the input value
        const heroName = document.getElementById("heroName").value;

        // Get the message area
        const messageArea = document.getElementById("messageArea");

        // Validation: check if input is empty
        if (heroName === "" || heroName.trim() === "") {
          // Display error message (red text)
          messageArea.innerHTML =
            '<p class="error-message">Error: Please enter a hero name!</p>';
        } else {
          // Display success message (green text)
          messageArea.innerHTML =
            '<p class="success-message">✅ Welcome, ' + heroName + "!</p>";
        }
      }
    </script>
  </body>
</html>
